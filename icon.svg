<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Fondo con las 4 esquinas redondeadas (rx="28") -->
  <rect width="128" height="128" rx="28" fill="#1E293B"/>

  <!-- Ejes de la gráfica -->
  <path
    d="M24 34 V98 H104"
    fill="none"
    stroke="#475569"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Línea de bajada de precio -->
  <polyline
    points="28,46 52,46 68,70 84,58 100,86"
    fill="none"
    stroke="#38BDF8"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Punto naranja -->
  <circle cx="100" cy="86" r="10" fill="#F97316"/>

  <!-- Badge compacto (44x44) en azul corporativo de Keepa -->
  <path
    d="M84 0 H100 A28 28 0 0 1 128 28 V44 H98 A14 14 0 0 1 84 30 Z"
    fill="#3B82B8"
  />

  <!-- Letra K completamente blanca -->
  <path
    d="M99 13 V31 M111 13 L100.5 22 L112 31"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>